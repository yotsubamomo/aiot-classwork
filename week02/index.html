<!doctype html>
<html lang="en" data-theme="aurora">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Momo's personal portal and live Taipei time.">
  <meta name="theme-color" content="#07120f">
  <title>Momo — Taipei Time</title>
  <!--
    這段必須在畫面繪製前同步執行，才不會先閃一下預設主題再換色，
    所以它是行內的一般 script，而不是會被延後執行的 module。
    主題清單與鍵名刻意與 core.js 的 THEMES、STORAGE_KEY 保持一致；
    舊鍵只是過渡期的後備，真正的搬移由 app.js 負責。
  -->
  <script>
    try {
      const raw = localStorage.getItem('aiot_user_state') ?? localStorage.getItem('momo-preferences');
      const saved = JSON.parse(raw);
      if (['aurora', 'minimal', 'sunset'].includes(saved?.theme)) {
        document.documentElement.dataset.theme = saved.theme;
      }
    } catch (_) {
      // Invalid or unavailable storage falls back to the default theme.
    }
  </script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="site-shell">
    <!-- 純裝飾的環境光暈，緩慢漂移；螢幕閱讀器忽略。 -->
    <div class="ambient-orbs" aria-hidden="true">
      <span class="orb orb-a"></span>
      <span class="orb orb-b"></span>
    </div>

    <header class="site-nav">
      <div class="brand-lockup">
        <span class="brand-mark" aria-hidden="true">M</span>
        <p class="eyebrow">Personal space<br>Taipei, Taiwan</p>
      </div>

      <div class="control-deck" role="group" aria-label="Display controls">
        <button class="control-button" id="theme-button" type="button" aria-label="Switch visual theme">
          <svg class="control-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42"></path>
          </svg>
          <span id="theme-label">Theme · Aurora</span>
        </button>

        <div class="format-switcher" role="group" aria-label="Time format">
          <button class="format-button" id="format-24" type="button" aria-pressed="true">24H</button>
          <button class="format-button" id="format-12" type="button" aria-pressed="false">12H</button>
        </div>

        <button class="control-button" id="copy-button" type="button">
          <svg class="control-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <rect x="8" y="8" width="12" height="12" rx="2"></rect>
            <path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"></path>
          </svg>
          <span>Copy time</span>
        </button>

        <button class="control-button" id="focus-button" type="button" aria-pressed="false">
          <svg class="control-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"></path>
          </svg>
          <span>Zen mode</span>
        </button>
      </div>
    </header>

    <section class="hero" aria-labelledby="display-name">
      <h1 id="display-name">MO<span>MO</span></h1>
    </section>

    <footer class="time-panel">
      <div class="clock-wrap">
        <!-- 秒數進度環：60 秒走完一圈，純裝飾，數值由旁邊的時鐘文字提供。 -->
        <svg class="second-ring" viewBox="0 0 100 100" aria-hidden="true">
          <circle class="second-ring-track" cx="50" cy="50" r="45"></circle>
          <circle class="second-ring-progress" id="second-ring" cx="50" cy="50" r="45"></circle>
        </svg>

        <div class="clock-stack">
          <div class="clock-line">
            <time class="clock" id="clock">--:--:--</time>
            <span class="meridiem" id="meridiem" hidden></span>
          </div>
          <p class="clock-meta">
            <span>UNIX <span id="epoch">—</span></span>
            <span aria-hidden="true">·</span>
            <span><span id="milliseconds">000</span> ms</span>
          </p>
        </div>
      </div>
      <div class="date-block">
        <p class="date" id="date">Loading Taipei time…</p>
        <p class="timezone">Asia/Taipei · UTC+8</p>
      </div>
    </footer>
  </main>

  <button class="focus-exit" id="focus-exit" type="button">
    <svg class="control-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
      <path d="M9 18l6-6-6-6"></path>
    </svg>
    Exit Zen mode
  </button>

  <div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
      <path d="M20 6 9 17l-5-5"></path>
    </svg>
    <span id="toast-message">Taipei time copied</span>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
